[project]
name = "evo-research"
version = "0.1.0"
description = "Persistent corpus-aware research knowledge system"
requires-python = ">=3.12"
dependencies = [
    "sqlite-vec>=0.1.6",
    "boto3>=1.35.0",
    "trafilatura>=2.0.0",
    "beautifulsoup4>=4.13.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "httpx>=0.27.0",
    "ruff>=0.15.15",
    "mypy>=2.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["scripts"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "if __name__ == .__main__.:",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (modern Python syntax)
    "B",   # flake8-bugbear (common bugs)
    "SIM", # flake8-simplify
]
ignore = [
    "E501",   # line length — handled by formatter where possible, SQL/strings are naturally wide
    "SIM108", # ternary suggestions — if/else is often more readable
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
