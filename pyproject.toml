[project]
name = "evo-research"
version = "0.1.0"
description = "Persistent corpus-aware research knowledge system"
requires-python = ">=3.12"
dependencies = [
    "sqlite-vec>=0.1.6",
    "anthropic>=0.49.0",
    "openai>=1.68.0",
    "trafilatura>=2.0.0",
    "beautifulsoup4>=4.13.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["scripts"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "if __name__ == .__main__.:",
]
