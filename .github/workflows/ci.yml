name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Type check
        env:
          EVO_RESEARCH_STORE: /tmp/evo-test-store
        run: uv run mypy scripts/ core/ server/

      - name: Run tests
        env:
          EVO_RESEARCH_STORE: /tmp/evo-test-store
        run: uv run pytest -v

  portal:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: portal
        run: bun install

      - name: Lint & format check
        working-directory: portal
        run: bun run check

      - name: Type check
        working-directory: portal
        run: bun run typecheck

      - name: Run tests
        working-directory: portal
        run: bun run test

      - name: Build
        working-directory: portal
        run: bun run build
